name: Unpack project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -q lexsolve-ai.zip
          cp -r lexsolve/. .
          rm -rf lexsolve lexsolve-ai.zip
      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add LexSolve AI project"
          git push
